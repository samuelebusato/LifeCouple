<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="LifeCouple">
  <!--
    Favicon di LifeCouple: l'emblema dell'app — due cuori intrecciati, «due
    metà che diventano una» — dagli STESSI tracciati di components/emblema.tsx
    e del <symbol id="emblema"> della landing. Se cambia lì, va cambiato qui.

    ⚠️ NON è assets/images/icon.png: quello (come favicon.png e le icone
    Android) è ancora il chevron blu del template Expo, mai sostituito.

    Due scostamenti dall'originale, entrambi per la dimensione d'uso:
      - stroke 9 invece di 3. A 16 px un tratto da 3/100 vale 0,48 px e
        semplicemente non si vede; a 9/100 vale 1,4 px a 16 px e 2,9 px a
        32 px, che è la dimensione che i browser chiedono davvero su schermi
        a densità doppia.
      - tessera piena color accento invece di line-art trasparente: una
        favicon rosa su fondo trasparente sparisce sulla barra chiara di
        Chrome e su quella scura di Safari. La tessera regge su entrambe.
  -->
  <rect width="100" height="100" rx="24" fill="#e4259e"/>
  <g fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M42 78C30 68 16 58 16 42c0-9 7-16 16-16 6 0 10 3 13 8"/>
    <path d="M45 34c3-5 7-8 13-8 9 0 16 7 16 16 0 16-14 26-26 36" opacity=".62"/>
    <path d="M44 42l6 6 6-6"/>
  </g>
</svg>
